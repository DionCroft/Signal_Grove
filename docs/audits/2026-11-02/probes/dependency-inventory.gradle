gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    app.tasks.register('auditDependencyInventory') {
        doLast {
            def modules = app.configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult.allComponents
                .findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                .collect { [group: it.id.group, name: it.id.module, version: it.id.version] }
                .unique { "${it.group}:${it.name}:${it.version}" }
                .sort { "${it.group}:${it.name}:${it.version}" }
            def destination = new File(System.getenv('HERMES_AUDIT_DIR'), 'runtime-dependencies.json')
            destination.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(modules)), 'UTF-8')
            println("Audited production dependency coordinates: ${modules.size()}")
        }
    }
}
