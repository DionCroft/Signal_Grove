name: Pinned Hermes native SDK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/hermes-native-sdk.yml', 'scripts/verify_canonical_rpc.py', 'scripts/tests/test_verify_canonical_rpc.py', 'scripts/hermes_persistence_compatibility.py', 'scripts/canonical_shutdown_gate.py', 'scripts/native/stamped_receipt_transport.py']
  pull_request:
    paths: ['.github/workflows/hermes-native-sdk.yml', 'scripts/verify_canonical_rpc.py', 'scripts/tests/test_verify_canonical_rpc.py', 'scripts/hermes_persistence_compatibility.py', 'scripts/canonical_shutdown_gate.py', 'scripts/native/stamped_receipt_transport.py']
permissions:
  contents: read
concurrency:
  group: hermes-native-sdk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  canonical-linux-plugin-rpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: client
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: 3b421578588243f920886e6fe79a6faa87ea026e
          path: sdk
          persist-credentials: false
      - name: Verify pristine pinned SDK before provisioning
        run: |
          # This disposable checkout uses exact Git blob bytes, including PS1.
          # The SDK declares PS1 CRLF by default; no tracked attribute is edited.
          test ! -e sdk/.git/info/attributes
          printf '%s\n' '*.ps1 -text' > sdk/.git/info/attributes
          python3 -I -B - <<'PY'
          from pathlib import Path
          import subprocess
          for raw in subprocess.check_output(['git','-C','sdk','ls-files','-z','*.ps1']).split(b'\0'):
              if raw:
                  name=raw.decode('utf8')
                  (Path('sdk')/name).write_bytes(subprocess.check_output(['git','-C','sdk','show','HEAD:'+name]))
          PY
          mkdir "$RUNNER_TEMP/canonical-plugin-rpc"
          python3 -I -B client/scripts/verify_canonical_rpc.py before --source sdk --evidence "$RUNNER_TEMP/canonical-plugin-rpc"
          python3 -B -m unittest discover -s client/scripts/tests -p test_verify_canonical_rpc.py -v
      - name: Build the supported PM side test environment
        id: pm
        uses: ./sdk/.github/actions/setup-pm
        with:
          toolchain: python
          extras: '["all"]'
          test-environment: 'true'
          archive-inputs: 'false'
          cache: 'false'
          cache-python: 'false'
          cache-node: 'false'
      - name: Run the complete canonical RPC file on Linux
        working-directory: sdk
        env:
          HERMES_PYTHON: ${{ steps.pm.outputs.python-path }}
        run: |
          "$HERMES_PYTHON" -I -B - <<'PY'
          import json,os,platform,sys
          from pathlib import Path
          from importlib.metadata import version
          record=dict(role='supported-pm-side-test-environment',system=platform.system(),machine=platform.machine(),python=sys.version,pytest=version('pytest'),executable=sys.executable,prefix=sys.prefix)
          (Path(os.environ['RUNNER_TEMP'])/'canonical-plugin-rpc/test-environment.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          set +e
          set -o pipefail
          scripts/run_tests.sh tests/gateway/test_session_plugin_rpc.py -j 1 --file-retries 0 --file-timeout 240 -- -v --junitxml="$RUNNER_TEMP/canonical-plugin-rpc/canonical.xml" 2>&1 | tee "$RUNNER_TEMP/canonical-plugin-rpc/canonical.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/canonical-plugin-rpc/canonical-exit-code.txt"
          exit "$status"
      - name: Verify all six positives and unchanged SDK source
        if: ${{ !cancelled() }}
        run: python3 -I -B client/scripts/verify_canonical_rpc.py after --source sdk --evidence "$RUNNER_TEMP/canonical-plugin-rpc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pristine-linux-canonical-plugin-rpc
          path: ${{ runner.temp }}/canonical-plugin-rpc
          if-no-files-found: error
          retention-days: 30

  public-linux-persistence:
    strategy:
      fail-fast: false
      matrix:
        source_commit:
          - caafe5389ae585ef77387a962aee05b1bcf17029
          - 2de9f51b8008a7d49a49221c184f2f11cbfc4af1
          - 8fc0374447313e276f6b9a2764bfc750190c966a
          - 5725d1d390ac4b7cfe157ea32bd6f4db1a280368
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: client
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.source_commit }}
          path: sdk
          persist-credentials: false
      - name: Verify exact public SDK before provisioning
        env:
          SOURCE_COMMIT: ${{ matrix.source_commit }}
        run: |
          test ! -e sdk/.git/info/attributes
          printf '%s\n' '*.ps1 -text' > sdk/.git/info/attributes
          python3 -I -B - <<'PY'
          from pathlib import Path
          import subprocess
          for raw in subprocess.check_output(['git','-C','sdk','ls-files','-z','*.ps1']).split(b'\0'):
              if raw:
                  name=raw.decode('utf8')
                  (Path('sdk')/name).write_bytes(subprocess.check_output(['git','-C','sdk','show','HEAD:'+name]))
          PY
          python3 -I -B client/scripts/canonical_shutdown_gate.py prepare \
            --source sdk --evidence "$RUNNER_TEMP/persistence" --variant pristine --source-commit "$SOURCE_COMMIT"
      - name: Build the supported PM side test environment
        id: pm
        uses: ./sdk/.github/actions/setup-pm
        with:
          toolchain: python
          extras: '["all"]'
          test-environment: 'true'
          archive-inputs: 'false'
          cache: 'false'
          cache-python: 'false'
          cache-node: 'false'
      - name: Exercise native gateway authentication, recovery and missing-workspace refusal
        id: gateway_auth
        if: matrix.source_commit == '8fc0374447313e276f6b9a2764bfc750190c966a' || matrix.source_commit == '5725d1d390ac4b7cfe157ea32bd6f4db1a280368'
        working-directory: sdk
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          if [[ -e test_durations.json || -L test_durations.json ]]; then
            echo "Unexpected pre-existing SDK timing cache" >&2
            exit 1
          fi
          suites=(test_native_http_auth test_native_plugin_ws_auth test_session_authority test_session_policy_workspace_readiness)
          overall=0
          for suite in "${suites[@]}"; do
            report="$RUNNER_TEMP/persistence/gateway-$suite"
            if scripts/run_tests.sh "tests/gateway/$suite.py" -j 1 --file-retries 0 --fail-on-skip \
              --file-timeout 240 -- -v --junitxml="$report.xml" 2>&1 | tee "$report.log"; then
              printf '%s\n' 0 > "$report.exit-code"
            else
              printf '%s\n' "$?" > "$report.exit-code"
              overall=1
            fi
          done
          # Preserve the runner's generated cache without mixing it with SDK source.
          python3 -I -B - "$RUNNER_TEMP/persistence/gateway-durations.json" "${suites[@]}" <<'PY'
          import json
          import math
          from pathlib import Path
          import sys
          cache = Path("test_durations.json")
          destination = Path(sys.argv[1])
          expected = {f"tests/gateway/{name}.py" for name in sys.argv[2:]}
          if cache.exists() or cache.is_symlink():
              assert cache.is_file() and not cache.is_symlink() and cache.stat().st_size <= 4096
              durations = json.loads(cache.read_bytes())
              assert type(durations) is dict and bool(durations) and durations.keys() <= expected
              assert all(type(value) in (float, int) and math.isfinite(value) and value >= 0
                         for value in durations.values())
              assert not destination.exists()
              cache.rename(destination)
          PY
          exit "$overall"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: matrix.source_commit == '8fc0374447313e276f6b9a2764bfc750190c966a' || matrix.source_commit == '5725d1d390ac4b7cfe157ea32bd6f4db1a280368'
        with:
          repository: NousResearch/hermes-agent
          ref: 0357a14b76e4f604d2fa6b9c3a973f9a76f7968d
          path: stamped-sdk
          persist-credentials: false
      - name: Read a retained stamped receipt over the upgraded authenticated gateway
        id: stamped_receipt
        if: matrix.source_commit == '8fc0374447313e276f6b9a2764bfc750190c966a' || matrix.source_commit == '5725d1d390ac4b7cfe157ea32bd6f4db1a280368'
        env:
          SOURCE_COMMIT: ${{ matrix.source_commit }}
          PM_PYTHON: ${{ steps.pm.outputs.python-path }}
        run: |
          python3 -I -B - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('stamped-sdk')
          with (source / '.git/info/attributes').open('x', encoding='utf-8') as attributes:
              attributes.write('*.ps1 -text\n')
          files = subprocess.check_output(['git', '-C', str(source), 'ls-files', '-z', '*.ps1'])
          for raw in files.split(b'\0'):
              if raw:
                  name = raw.decode('utf-8')
                  (source / name).write_bytes(subprocess.check_output(['git', '-C', str(source), 'show', 'HEAD:' + name]))
          PY
          "$PM_PYTHON" -I -B client/scripts/native/stamped_receipt_transport.py \
            --legacy stamped-sdk --current sdk --current-commit "$SOURCE_COMMIT" \
            --evidence "$RUNNER_TEMP/persistence/stamped-receipt"
      - name: Run one unchanged, source-bound persistence cohort
        if: ${{ !cancelled() && (success() || steps.gateway_auth.conclusion == 'failure' || steps.stamped_receipt.conclusion == 'failure') }}
        env:
          PM_PYTHON: ${{ steps.pm.outputs.python-path }}
        run: |
          python3 -I -B client/scripts/hermes_persistence_compatibility.py \
            --source sdk --evidence "$RUNNER_TEMP/persistence" --python "$PM_PYTHON"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-linux-persistence-${{ matrix.source_commit }}
          path: |
            ${{ runner.temp }}/persistence/before.json
            ${{ runner.temp }}/persistence/base-map.json
            ${{ runner.temp }}/persistence/persistence-*.json
            ${{ runner.temp }}/persistence/persistence.xml
            ${{ runner.temp }}/persistence/persistence.log
            ${{ runner.temp }}/persistence/gateway-*
            ${{ runner.temp }}/persistence/stamped-receipt/gateway-*
          if-no-files-found: error
          retention-days: 30
