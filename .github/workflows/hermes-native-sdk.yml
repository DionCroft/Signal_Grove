name: Pinned Hermes native SDK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/hermes-native-sdk.yml', 'scripts/verify_canonical_rpc.py', 'scripts/tests/test_verify_canonical_rpc.py', 'scripts/hermes_persistence_compatibility.py', 'scripts/canonical_shutdown_gate.py']
  pull_request:
    paths: ['.github/workflows/hermes-native-sdk.yml', 'scripts/verify_canonical_rpc.py', 'scripts/tests/test_verify_canonical_rpc.py', 'scripts/hermes_persistence_compatibility.py', 'scripts/canonical_shutdown_gate.py']
permissions:
  contents: read
concurrency:
  group: hermes-native-sdk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  canonical-linux-plugin-rpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: client
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: 3b421578588243f920886e6fe79a6faa87ea026e
          path: sdk
          persist-credentials: false
      - name: Verify pristine pinned SDK before provisioning
        run: |
          # This disposable checkout uses exact Git blob bytes, including PS1.
          # The SDK declares PS1 CRLF by default; no tracked attribute is edited.
          test ! -e sdk/.git/info/attributes
          printf '%s\n' '*.ps1 -text' > sdk/.git/info/attributes
          python3 -I -B - <<'PY'
          from pathlib import Path
          import subprocess
          for raw in subprocess.check_output(['git','-C','sdk','ls-files','-z','*.ps1']).split(b'\0'):
              if raw:
                  name=raw.decode('utf8')
                  (Path('sdk')/name).write_bytes(subprocess.check_output(['git','-C','sdk','show','HEAD:'+name]))
          PY
          mkdir "$RUNNER_TEMP/canonical-plugin-rpc"
          python3 -I -B client/scripts/verify_canonical_rpc.py before --source sdk --evidence "$RUNNER_TEMP/canonical-plugin-rpc"
          python3 -B -m unittest discover -s client/scripts/tests -p test_verify_canonical_rpc.py -v
      - name: Build the supported PM side test environment
        id: pm
        uses: ./sdk/.github/actions/setup-pm
        with:
          toolchain: python
          extras: '["all"]'
          test-environment: 'true'
          archive-inputs: 'false'
          cache: 'false'
          cache-python: 'false'
          cache-node: 'false'
      - name: Run the complete canonical RPC file on Linux
        working-directory: sdk
        env:
          HERMES_PYTHON: ${{ steps.pm.outputs.python-path }}
        run: |
          "$HERMES_PYTHON" -I -B - <<'PY'
          import json,os,platform,sys
          from pathlib import Path
          from importlib.metadata import version
          record=dict(role='supported-pm-side-test-environment',system=platform.system(),machine=platform.machine(),python=sys.version,pytest=version('pytest'),executable=sys.executable,prefix=sys.prefix)
          (Path(os.environ['RUNNER_TEMP'])/'canonical-plugin-rpc/test-environment.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          set +e
          set -o pipefail
          scripts/run_tests.sh tests/gateway/test_session_plugin_rpc.py -j 1 --file-retries 0 --file-timeout 240 -- -v --junitxml="$RUNNER_TEMP/canonical-plugin-rpc/canonical.xml" 2>&1 | tee "$RUNNER_TEMP/canonical-plugin-rpc/canonical.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/canonical-plugin-rpc/canonical-exit-code.txt"
          exit "$status"
      - name: Verify all six positives and unchanged SDK source
        if: ${{ !cancelled() }}
        run: python3 -I -B client/scripts/verify_canonical_rpc.py after --source sdk --evidence "$RUNNER_TEMP/canonical-plugin-rpc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pristine-linux-canonical-plugin-rpc
          path: ${{ runner.temp }}/canonical-plugin-rpc
          if-no-files-found: error
          retention-days: 30

  public-linux-persistence:
    strategy:
      fail-fast: false
      matrix:
        source_commit: [caafe5389ae585ef77387a962aee05b1bcf17029, 2de9f51b8008a7d49a49221c184f2f11cbfc4af1, 8fc0374447313e276f6b9a2764bfc750190c966a, 1d15aad1dfa8e9e5fcbd2082cad5666a0907a07d]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: client
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.source_commit }}
          path: sdk
          persist-credentials: false
      - name: Verify exact public SDK before provisioning
        env:
          SOURCE_COMMIT: ${{ matrix.source_commit }}
        run: |
          test ! -e sdk/.git/info/attributes
          printf '%s\n' '*.ps1 -text' > sdk/.git/info/attributes
          python3 -I -B - <<'PY'
          from pathlib import Path
          import subprocess
          for raw in subprocess.check_output(['git','-C','sdk','ls-files','-z','*.ps1']).split(b'\0'):
              if raw:
                  name=raw.decode('utf8')
                  (Path('sdk')/name).write_bytes(subprocess.check_output(['git','-C','sdk','show','HEAD:'+name]))
          PY
          python3 -I -B client/scripts/canonical_shutdown_gate.py prepare \
            --source sdk --evidence "$RUNNER_TEMP/persistence" --variant pristine --source-commit "$SOURCE_COMMIT"
      - name: Build the supported PM side test environment
        id: pm
        uses: ./sdk/.github/actions/setup-pm
        with:
          toolchain: python
          extras: '["all"]'
          test-environment: 'true'
          archive-inputs: 'false'
          cache: 'false'
          cache-python: 'false'
          cache-node: 'false'
      - name: Run one unchanged, source-bound persistence cohort
        env:
          PM_PYTHON: ${{ steps.pm.outputs.python-path }}
        run: |
          python3 -I -B client/scripts/hermes_persistence_compatibility.py \
            --source sdk --evidence "$RUNNER_TEMP/persistence" --python "$PM_PYTHON"
      - name: Run unchanged native authentication, approval and scheduler receipt tests
        if: matrix.source_commit == '8fc0374447313e276f6b9a2764bfc750190c966a' || matrix.source_commit == '1d15aad1dfa8e9e5fcbd2082cad5666a0907a07d'
        env:
          PM_PYTHON: ${{ steps.pm.outputs.python-path }}
        run: |
          proof="$RUNNER_TEMP/profile-receipts"
          mkdir "$proof"
          cp "$RUNNER_TEMP/persistence/"{before,base-map}.json "$proof"
          python3 -I -B client/scripts/hermes_persistence_compatibility.py --profile-receipts \
            --source sdk --evidence "$proof" --python "$PM_PYTHON"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && (matrix.source_commit == '8fc0374447313e276f6b9a2764bfc750190c966a' || matrix.source_commit == '1d15aad1dfa8e9e5fcbd2082cad5666a0907a07d') }}
        with:
          name: public-linux-profile-receipts-${{ matrix.source_commit }}
          path: |
            ${{ runner.temp }}/profile-receipts/persistence-*.json
            ${{ runner.temp }}/profile-receipts/persistence.xml
            ${{ runner.temp }}/profile-receipts/persistence.log
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-linux-persistence-${{ matrix.source_commit }}
          path: |
            ${{ runner.temp }}/persistence/before.json
            ${{ runner.temp }}/persistence/base-map.json
            ${{ runner.temp }}/persistence/persistence-*.json
            ${{ runner.temp }}/persistence/persistence.xml
            ${{ runner.temp }}/persistence/persistence.log
          if-no-files-found: error
          retention-days: 30
