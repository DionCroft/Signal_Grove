name: Android CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate dependency verification policy
        run: |
          python3 -B -m unittest discover -s scripts/tests -v
          python3 -B scripts/check_verification_policy.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install SDK
        run: sdkmanager 'platforms/android-37' 'build-tools/36.0.0'
      - name: Build, test, lint and compile instrumentation
        env:
          HERMES_BUILD_HOME: ${{ runner.temp }}/hermes-signing
        run: |
          mkdir -p "$HERMES_BUILD_HOME"
          chmod +x gradlew
          ./gradlew --no-daemon --dependency-verification strict build testDebugUnitTest lint assembleDebug assembleDebugAndroidTest
      - name: Review sensitive files
        run: python3 -B scripts/secret_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 7

      - name: Retain dependency verification failure details
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-verification-reports
          path: build/reports/dependency-verification/
          if-no-files-found: ignore
          retention-days: 7

  device:
    name: Device API ${{ matrix.api }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 37]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-debug-and-reports
          path: ${{ runner.temp }}/hermes-apks
      - name: Enable KVM on the isolated runner
        run: sudo chmod a+rw /dev/kvm
      - name: Execute the complete device suite
        env:
          DEVICE_API: ${{ matrix.api }}
        run: python3 -B scripts/ci_android_device.py --api "$DEVICE_API" --artifacts "$RUNNER_TEMP/hermes-apks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-device-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/hermes-device-qa/instrumentation.log
            ${{ runner.temp }}/hermes-device-qa/test-runner.log
            ${{ runner.temp }}/hermes-device-qa/emulator.log
            ${{ runner.temp }}/hermes-device-qa/sdk.log
            ${{ runner.temp }}/hermes-device-qa/screenshots/
          if-no-files-found: warn
          retention-days: 7
