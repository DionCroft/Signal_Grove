name: Android CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install SDK
        run: sdkmanager 'platforms/android-37' 'build-tools/36.0.0'
      - name: Build, test, lint and compile instrumentation
        env:
          HERMES_BUILD_HOME: ${{ runner.temp }}/hermes-signing
        run: |
          mkdir -p "$HERMES_BUILD_HOME"
          chmod +x gradlew
          ./gradlew --no-daemon build testDebugUnitTest lint assembleDebug assembleDebugAndroidTest
      - name: Review sensitive files
        run: python3 -B scripts/secret_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 7
