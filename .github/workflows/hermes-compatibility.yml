name: Hermes compatibility
on:
  schedule:
    - cron: '27 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/check_hermes_contract.py', 'scripts/compatibility_probe_dashboard_registry.py', 'scripts/tests/**', 'docs/contracts/**', '.github/workflows/hermes-compatibility.yml']
  pull_request:
    paths: ['scripts/check_hermes_contract.py', 'scripts/compatibility_probe_dashboard_registry.py', 'scripts/tests/**', 'docs/contracts/**', '.github/workflows/hermes-compatibility.yml']
permissions:
  contents: read
concurrency:
  group: hermes-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 -B -m unittest discover -s scripts/tests -v
          python3 -B -m unittest discover -s server_extensions/runtime_models -v
  upstream:
    if: github.event_name != 'pull_request'
    needs: parser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore public upstream source blobs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hermes-public-source-cache
          key: hermes-public-source-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hermes-public-source-v1-
      - name: Inspect latest stable source without executing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/check_hermes_contract.py --source-cache "$RUNNER_TEMP/hermes-public-source-cache" --request-interval 1 --ref latest --output "$RUNNER_TEMP/hermes-contract-latest.json"
      - name: Inspect main source without executing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/check_hermes_contract.py --source-cache "$RUNNER_TEMP/hermes-public-source-cache" --request-interval 1 --ref main --output "$RUNNER_TEMP/hermes-contract-main.json"
      - name: Check public blobs for safe retention
        if: always()
        id: cache-publication
        run: |
          python3 -B - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('checker',Path('scripts/check_hermes_contract.py'))
          checker=importlib.util.module_from_spec(spec);spec.loader.exec_module(checker)
          ready=checker.source_cache_publishable(Path(os.environ['RUNNER_TEMP'])/'hermes-public-source-cache')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('ready='+str(ready).lower()+'\n')
          PY
      - name: Retain only validated public source blobs
        if: always() && steps.cache-publication.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hermes-public-source-cache
          key: hermes-public-source-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summarize compatibility results
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              for ref in ('latest','main'):
                  source=Path(os.environ['RUNNER_TEMP'])/('hermes-contract-'+ref+'.json')
                  summary.write('### '+ref+'\n\n')
                  if not source.exists():
                      summary.write('Inspection incomplete or not run after an earlier failure; no compatibility success is claimed.\n\n')
                      continue
                  result=json.loads(source.read_text());cache=result['current'].get('source_cache',{})
                  summary.write('Upstream commit: '+result['current']['commit']+'\n\n')
                  summary.write('Used-contract review required: '+str(result['mobile_review_required'])+'\n\n')
                  summary.write('Verified source cache hits/downloads: '+str(cache.get('verified_hits','unknown'))+'/'+str(cache.get('verified_downloads','unknown'))+'\n\n')
                  summary.write('Explicit pinned source absences: '+str(len(result['current'].get('reviewed_source_absences',[])))+'\n\n')
                  summary.write('Changed source modules: '+str(len(result['changed_source_modules']))+'\n\n')
                  summary.write('New API routes: '+str(len(result['added_routes']))+'; new management routes: '+str(len(result['added_management_routes']))+'. See the artifact for details.\n\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hermes-contract-latest
          path: ${{ runner.temp }}/hermes-contract-latest.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hermes-contract-main
          path: ${{ runner.temp }}/hermes-contract-main.json
          if-no-files-found: warn
          retention-days: 30

  pinned-registry-modules:
    needs: parser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare the exact reviewed public registry modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('checker',Path('scripts/check_hermes_contract.py'))
          checker=importlib.util.module_from_spec(spec);spec.loader.exec_module(checker)
          checker._REQUEST_INTERVAL=1.0
          root=Path(os.environ['RUNNER_TEMP'])/'registry-e36-source'
          root.mkdir(parents=True,exist_ok=False)
          pin='e36d4e57359074d0f9e8ccc8981bca16b893ad7f'
          for name in ('hermes_constants.py','hermes_cli/dashboard_auth/base.py','agent/provider_registry.py','hermes_cli/dashboard_auth/registry.py'):
              text=checker.github_source(name,pin)
              path=root/name;path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf-8',newline='\n')
          PY
      - name: Execute bounded real-module registry regressions
        run: python3 -I -B scripts/compatibility_probe_dashboard_registry.py --source-root "${{ runner.temp }}/registry-e36-source" --work-root "${{ runner.temp }}/registry-e36-result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pinned-registry-module-results
          path: ${{ runner.temp }}/registry-e36-result/result.json
          if-no-files-found: warn
          retention-days: 30
