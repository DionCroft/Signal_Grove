name: Hermes compatibility
on:
  schedule:
    - cron: '27 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/check_hermes_contract.py', 'scripts/tests/**', 'docs/contracts/**', '.github/workflows/hermes-compatibility.yml']
  pull_request:
    paths: ['scripts/check_hermes_contract.py', 'scripts/tests/**', 'docs/contracts/**', '.github/workflows/hermes-compatibility.yml']
permissions:
  contents: read
concurrency:
  group: hermes-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -B -m unittest discover -s scripts/tests -v
  upstream:
    if: github.event_name != 'pull_request'
    needs: parser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ref: [latest, main]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore public upstream source blobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hermes-public-source-cache
          key: hermes-public-source-v1-${{ matrix.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hermes-public-source-v1-${{ matrix.ref }}-
            hermes-public-source-v1-
      - name: Inspect pinned upstream source without executing it
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ matrix.ref }}
        run: python3 -B scripts/check_hermes_contract.py --source-cache "$RUNNER_TEMP/hermes-public-source-cache" --request-interval 1 --ref "$UPSTREAM_REF" --output "$RUNNER_TEMP/hermes-contract.json"
      - name: Summarize compatibility result
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source=Path(os.environ['RUNNER_TEMP'])/'hermes-contract.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              if not source.exists():
                  summary.write('Upstream inspection incomplete. Review job logs; no compatibility success is claimed.\n')
              else:
                  result=json.loads(source.read_text())
                  summary.write('Upstream commit: '+result['current']['commit']+'\n\n')
                  summary.write('Used-contract review required: '+str(result['mobile_review_required'])+'\n\n')
                  cache=result['current'].get('source_cache',{})
                  summary.write('Verified source cache hits/downloads: '+str(cache.get('verified_hits','unknown'))+'/'+str(cache.get('verified_downloads','unknown'))+'\n\n')
                  summary.write('Changed source modules: '+str(len(result['changed_source_modules']))+'\n\n')
                  summary.write('New API routes: '+str(len(result['added_routes']))+'; new management routes: '+str(len(result['added_management_routes']))+'. See the artifact for details.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hermes-contract-${{ matrix.ref }}
          path: ${{ runner.temp }}/hermes-contract.json
          if-no-files-found: warn
          retention-days: 30
